<!DOCTYPE html>
<html>

<head>

    <title>View Notes</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<div class="toast-container position-fixed top-0 end-0 p-3">

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}

    <div class="toast show align-items-center text-bg-success border-0 mb-2" role="alert" data-bs-delay="3000">

        <div class="d-flex">
            <div class="toast-body">
                {{ message }}
            </div>

            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
            </button>
        </div>

    </div>

    {% endfor %}
    {% endif %}
    {% endwith %}

</div>

<body>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                View Note

            </div>

            <div class="card-body">

            {% if notes_data %}

                <div class="mb-3">

                    <label>
                        Title
                    </label>

                    <input type="text" name="title" value="{{notes_data[1]}}" class="form-control" readonly>

                </div>

                <div class="mb-3">

                    <label>
                        Content
                    </label>

                    <textarea class="form-control" name="description" rows="6" readonly>{{notes_data[2]}}</textarea>

                </div>
                {% else %}
                <p>Note not found.</p>
                {% endif %}
                <button class="btn btn-primary">
                    Save Note
                </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
