<!DOCTYPE html>
    <html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Forgot Password | Auth System</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <style>

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;

                display: flex;
                align-items: center;
                justify-content: center;

                background: linear-gradient(135deg, #0f172a, #1e3a8a);

                font-family: "Segoe UI", sans-serif;
            }

            .forgot-wrapper {
                width: 100%;
                max-width: 450px;
                padding: 20px;
            }

            .forgot-card {
                background: white;
                padding: 40px;
                border-radius: 22px;

                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            }

            .icon-box {
                width: 65px;
                height: 65px;

                margin: 0 auto 20px;

                display: flex;
                align-items: center;
                justify-content: center;

                background: #2563eb;
                color: white;

                border-radius: 18px;

                font-size: 28px;

                box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
            }

            .forgot-card h2 {
                text-align: center;
                color: #0f172a;
                font-weight: 700;
            }

            .description {
                text-align: center;
                color: #64748b;
                margin-bottom: 30px;
            }

            .form-label {
                font-weight: 600;
                color: #334155;
            }

            .form-control {
                height: 50px;
                border-radius: 10px;
                border: 1px solid #cbd5e1;
                padding: 10px 15px;
            }

            .form-control:focus {
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }

            .reset-btn {
                height: 50px;
                border: none;

                background: #2563eb;
                color: white;

                border-radius: 10px;

                font-weight: 600;

                transition: 0.3s;
            }

            .reset-btn:hover {
                background: #1d4ed8;
                transform: translateY(-2px);

                box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            }

            .back-link {
                display: block;

                text-align: center;

                margin-top: 25px;

                color: #2563eb;

                text-decoration: none;

                font-weight: 500;
            }

            .back-link:hover {
                text-decoration: underline;
            }

            .alert {
                border-radius: 10px;
            }

        </style>

    </head>

    <body>

    <div class="forgot-wrapper">

        <div class="forgot-card">

            <!-- Icon -->

            <div class="icon-box">

                <i class="fa-solid fa-key"></i>

            </div>


            <h2>Forgot Password?</h2>

            <p class="description">

                Enter your registered email address and we'll send you
                a link to reset your password.

            </p>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-info alert-dismissible fade show"
                            role="alert">

                            {{ message }}

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Forgot Password Form -->

            <form method="POST
            "
                action="{{ url_for('forgot') }}">

                <div class="mb-4">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="forgot password"
                        class="form-control"
                        placeholder="Enter your registered email"
                        required>

                </div>


                <button type="submit"
                        class="btn reset-btn w-100">

                    <i class="fa-solid fa-paper-plane me-2"></i>

                    Send Reset Link

                </button>

            </form>


            <!-- Back to Login -->

            <a href="{{ url_for('userlogin') }}"
            class="back-link">

                <i class="fa-solid fa-arrow-left me-2"></i>

                Back to Login

            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    </body>

    </html>
