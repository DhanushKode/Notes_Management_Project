<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 400px;

            background: white;
            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: 600;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Set New Password</h2>

        <form id="passwordForm">

            <div class="form-group">
                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >
            </div>


            <button
                type="submit"
                id="submitButton"
            >
                Update Password
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script>

        // Token received from Flask/Jinja
        const data = {{ userdata | tojson }};

        console.log("Token:", data);


        const form =
            document.getElementById("passwordForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const submitButton =
            document.getElementById("submitButton");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async function (e) {

            e.preventDefault();


            // Clear previous message
            message.textContent = "";
            message.className = "";


            // Get password values
            const password =
                newPassword.value;

            const confirm =
                confirmPassword.value;


            // Check passwords
            if (password !== confirm) {

                message.textContent =
                    "Passwords do not match!";

                message.className = "error";

                return;
            }


            // Optional password length check
            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                message.className = "error";

                return;
            }


            try {

                // Disable button while request is running
                submitButton.disabled = true;

                submitButton.textContent =
                    "Updating...";


                console.log("Sending PUT request...");


                // Send PUT request
                const response = await fetch(
                    `/newpassword/${encodeURIComponent(data)}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            password: password
                        })
                    }
                );


                console.log(
                    "Response status:",
                    response.status
                );


                const result =
                    await response.json();


                console.log(
                    "Response:",
                    result
                );


                if (
                    response.ok &&
                    result.status === "success"
                ) {

                    message.textContent =
                        result.message;

                    message.className =
                        "success";


                    // Disable form after successful reset
                    newPassword.disabled = true;
                    confirmPassword.disabled = true;
                    submitButton.disabled = true;


                    // Optional redirect to login
                    setTimeout(function () {

                        window.location.href =
                            "/userlogin";

                    }, 2000);


                } else {

                    message.textContent =
                        result.message ||
                        "Password update failed.";

                    message.className =
                        "error";

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Update Password";
                }

            } catch (error) {

                console.error(
                    "Request error:",
                    error
                );


                message.textContent =
                    "Something went wrong. Please try again.";

                message.className =
                    "error";


                submitButton.disabled = false;

                submitButton.textContent =
                    "Update Password";
            }

        });

    </script>

</body>

</html>
