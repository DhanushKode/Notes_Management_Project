<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>

<div class="container py-5">
    {% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <p style="color: aquamarine;">{{ message }}</p>
    {% endfor %}
    
  {% endif %}
{% endwith %}

<div class="login-card mx-auto">

<h2 class="text-center mb-4">

Login

</h2>

<form action="{{ url_for('userlogin') }}" method="POST">

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="text-end mb-4">


</div>

<button
type="submit"
class="btn btn-primary w-100">

Login

</button>

</form>

<a href="{{url_for('forgot')}}">
  <button>
    Forgot Password?
  </button>
</a>
<div class="text-center mt-4">

Don't have an account?

<a href="{{ url_for('userregister') }}">

Register

</a>

</div>

</div>

</div>

</body>

</html>
